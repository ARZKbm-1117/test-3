<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Semakan Markah PB</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-blue: #0A369D;
      --secondary-blue: #0056B3;
      --light-blue: #EFF6FF;
      --accent-red: #D90429;
      --dark-red: #9B001C;
      --bg-gradient: linear-gradient(135deg, #0A369D 0%, #1E1B4B 100%);
      --pure-white: #FFFFFF;
      --off-white: #F8FAFC;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .container {
      background: var(--pure-white);
      width: 100%;
      max-width: 850px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      border-top: 6px solid var(--accent-red);
    }

    .header {
      background: var(--primary-blue);
      color: var(--pure-white);
      padding: 35px 25px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 0.95rem;
      color: #93C5FD;
      font-weight: 400;
    }

    .search-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 14px 14px 48px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--secondary-blue);
      box-shadow: 0 0 0 4px rgba(10, 54, 157, 0.1);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-red);
      color: var(--pure-white);
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(217, 4, 41, 0.3);
    }

    .btn-submit:hover {
      background: var(--dark-red);
      transform: translateY(-1px);
    }

    /* Result Dashboard Styling */
    .result-container {
      margin-top: 30px;
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 0.95rem;
      color: var(--primary-blue);
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--light-blue);
      padding-bottom: 6px;
      text-transform: uppercase;
    }

    /* Grid Maklumat Pelajar */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .info-card {
      background: var(--off-white);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .info-card .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-card .val {
      font-size: 0.95rem;
      color: var(--text-dark);
      font-weight: 600;
    }

    /* --- REKA BENTUK KOTAK HIGHLIGHT PB & TOTAL --- */
    .highlight-marks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .highlight-card {
      padding: 22px 20px;
      border-radius: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 2px solid transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .highlight-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
    }

    /* Kotak PB (40%) - Biru */
    .highlight-card.pb-box {
      background: linear-gradient(145deg, #EFF6FF 0%, #DBEAFE 100%);
      border-color: #BFDBFE;
    }

    .highlight-card.pb-box .hl-title {
      color: var(--primary-blue);
    }

    .highlight-card.pb-box .hl-value {
      color: var(--primary-blue);
    }

    /* Kotak TOTAL (60%) - Merah */
    .highlight-card.total-box {
      background: linear-gradient(145deg, #FFF1F2 0%, #FFE4E6 100%);
      border-color: #FECDD3;
    }

    .highlight-card.total-box .hl-title {
      color: var(--accent-red);
    }

    .highlight-card.total-box .hl-value {
      color: var(--accent-red);
    }

    .hl-title {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hl-value {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1;
    }

    /* Grid Markah Perincian Biasa */
    .marks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .mark-card {
      background: var(--pure-white);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
    }

    .mark-card .mark-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .mark-card .mark-val {
      font-size: 1.25rem;
      color: var(--text-dark);
      font-weight: 700;
    }

    /* Seksyen Laporan PDF */
    .pdf-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .pdf-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--off-white);
      border: 1px solid var(--border-color);
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .pdf-button:hover {
      background: #FEF2F2;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .pdf-button .pdf-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pdf-button i.pdf-icon {
      font-size: 1.5rem;
      color: var(--accent-red);
    }

    .pdf-button .btn-tag {
      background: var(--accent-red);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pdf-button:hover .btn-tag {
      background: var(--dark-red);
    }

    /* Status Messages */
    .message-box {
      padding: 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
    }

    .message-box.error {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }

    .loader {
      display: none;
      margin: 20px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--accent-red);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      background: var(--off-white);
      padding: 18px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fa-solid fa-graduation-cap"></i> Semakan Markah PB</h1>
      <p>Sistem Portal Pentaksiran Berterusan Pelajar</p>
    </div>

    <!-- Content Body -->
    <div class="search-body">
      <form id="searchForm">
        <div class="form-group">
          <label for="noMatrik">Nombor Matrik Pelajar</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="noMatrik" placeholder="Masukkan No. Matrik (Cth: KVN123456)" required autocomplete="off">
          </div>
        </div>
        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-magnifying-glass"></i> Cari Keputusan
        </button>
      </form>

      <!-- Loader -->
      <div class="loader" id="loader"></div>

      <!-- Error Message -->
      <div class="message-box error" id="errorMessage"></div>

      <!-- Results Display Dashboard -->
      <div class="result-container" id="resultContainer">
        
        <!-- Seksyen 1: Maklumat Pelajar -->
        <div class="section-title">
          <i class="fa-solid fa-user-graduate"></i> Maklumat Pelajar
        </div>
        <div class="info-grid" id="studentInfoGrid">
          <!-- Diisi secara dinamik -->
        </div>

        <!-- Seksyen 2: Highlight Markah Utama (PB 40% & TOTAL 60%) -->
        <div class="section-title">
          <i class="fa-solid fa-trophy"></i> Ringkasan Keputusan Utama
        </div>
        <div class="highlight-marks-grid">
          <div class="highlight-card pb-box">
            <div class="hl-title"><i class="fa-solid fa-award"></i> <span id="pbLabel">JUMLAH PB (40%)</span></div>
            <div class="hl-value" id="pbValue">0.0%</div>
          </div>
          <div class="highlight-card total-box">
            <div class="hl-title"><i class="fa-solid fa-star"></i> <span id="totalLabel">TOTAL (60%)</span></div>
            <div class="hl-value" id="totalValue">0.0%</div>
          </div>
        </div>

        <!-- Seksyen 3: Perincian Markah PB -->
        <div class="section-title">
          <i class="fa-solid fa-list-check"></i> Perincian Komponen Markah
        </div>
        <div class="marks-grid" id="marksGrid">
          <!-- Diisi secara dinamik -->
        </div>

        <!-- Seksyen 4: Dokumen & Laporan PDF -->
        <div class="section-title" id="pdfSectionTitle" style="display: none;">
          <i class="fa-solid fa-folder-open"></i> Laporan & Tugasan (PDF)
        </div>
        <div class="pdf-section" id="pdfSection">
          <!-- Diisi secara dinamik -->
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      &copy; Hak Cipta Terpelihara - Sistem Semakan Markah PB
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2McDL6T1aL-mPeVO9b6k6m-tgQ5p2dj5JdU-265stIypG5Yb2FGPC_tdjEVsCfHc/exec";

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const noMatrik = document.getElementById('noMatrik').value.trim();
      const loader = document.getElementById('loader');
      const errorMessage = document.getElementById('errorMessage');
      const resultContainer = document.getElementById('resultContainer');
      
      const studentInfoGrid = document.getElementById('studentInfoGrid');
      const marksGrid = document.getElementById('marksGrid');
      const pdfSection = document.getElementById('pdfSection');
      const pdfSectionTitle = document.getElementById('pdfSectionTitle');

      // Element Highlight
      const pbLabel = document.getElementById('pbLabel');
      const pbValue = document.getElementById('pbValue');
      const totalLabel = document.getElementById('totalLabel');
      const totalValue = document.getElementById('totalValue');

      // Reset Paparan
      errorMessage.style.display = 'none';
      resultContainer.style.display = 'none';
      studentInfoGrid.innerHTML = '';
      marksGrid.innerHTML = '';
      pdfSection.innerHTML = '';
      pdfSectionTitle.style.display = 'none';
      
      pbValue.innerText = '0.0%';
      totalValue.innerText = '0.0%';

      loader.style.display = 'block';

      // Panggilan API ke Google Apps Script
      fetch(`${SCRIPT_URL}?id=${encodeURIComponent(noMatrik)}`)
        .then(response => response.json())
        .then(data => {
          loader.style.display = 'none';

          if (data.status === 'success') {
            const studentData = data.data;
            let hasPdf = false;

            for (const [key, value] of Object.entries(studentData)) {
              if (!key || key.trim() === "") continue;

              const valStr = String(value).trim();
              const keyLower = key.toLowerCase();
              const isUrl = valStr.startsWith('http://') || valStr.startsWith('https://');

              // 1. Laporan PDF / Assignment Link
              if (isUrl) {
                hasPdf = true;
                const pdfCard = document.createElement('a');
                pdfCard.className = 'pdf-button';
                pdfCard.href = valStr;
                pdfCard.target = '_blank';
                pdfCard.rel = 'noopener noreferrer';
                pdfCard.innerHTML = `
                  <div class="pdf-info">
                    <i class="fa-solid fa-file-pdf pdf-icon"></i>
                    <span>${key}</span>
                  </div>
                  <span class="btn-tag"><i class="fa-solid fa-download"></i> Buka PDF</span>
                `;
                pdfSection.appendChild(pdfCard);
              } 
              // 2. TANGKAP HIGHLIGHT: PB (40%) & TOTAL (60%)
              else if (keyLower.includes('jumlah pb') || keyLower.includes('pb (40%)') || keyLower.includes('40%')) {
                pbLabel.innerText = key;
                pbValue.innerText = valStr !== "" ? valStr : "0.0%";
              } 
              else if (keyLower.includes('total') || keyLower.includes('keseluruhan') || keyLower.includes('60%')) {
                totalLabel.innerText = key;
                totalValue.innerText = valStr !== "" ? valStr : "0.0%";
              }
              // 3. Markah-markah Perincian Biasa (Quiz, Test, Assignment)
              else if (
                keyLower.includes('markah') || 
                keyLower.includes('quiz') || 
                keyLower.includes('test') || 
                keyLower.includes('pb') ||
                keyLower.includes('assignment') ||
                (!isNaN(valStr) && valStr !== "") ||
                valStr.includes('%')
              ) {
                const markCard = document.createElement('div');
                markCard.className = 'mark-card';
                markCard.innerHTML = `
                  <div class="mark-label">${key}</div>
                  <div class="mark-val">${valStr !== "" ? valStr : "-"}</div>
                `;
                marksGrid.appendChild(markCard);
              } 
              // 4. Maklumat Am Pelajar
              else {
                const infoCard = document.createElement('div');
                infoCard.className = 'info-card';
                infoCard.innerHTML = `
                  <div class="label">${key}</div>
                  <div class="val">${valStr !== "" ? valStr : "-"}</div>
                `;
                studentInfoGrid.appendChild(infoCard);
              }
            }

            if (hasPdf) {
              pdfSectionTitle.style.display = 'flex';
            }

            resultContainer.style.display = 'block';
          } else {
            errorMessage.innerText = data.message || 'No. Matrik tidak dijumpai dalam rekod.';
            errorMessage.style.display = 'block';
          }
        })
        .catch(error => {
          loader.style.display = 'none';
          errorMessage.innerText = 'Ralat sambungan ke pangkalan data. Sila cuba lagi.';
          errorMessage.style.display = 'block';
          console.error('Error:', error);
        });
    });
  </script>
</body>
</html>
